# Drop-in for docker.service on the Paperless VM.
# Install: /etc/systemd/system/docker.service.d/wait-for-nfs.conf, then
#   systemctl daemon-reload
#
# Docker (and so Paperless) only starts once both NFS shares are mounted. If the
# NAS is unreachable at boot, Docker stays stopped instead of starting Paperless
# on top of empty mount points. Recovery once the NAS is back:
#   sudo mount -a && sudo systemctl start docker
# See services/paperless-ngx/README.md "Known Limitations".

[Unit]
RequiresMountsFor=/mnt/paperless /mnt/paperless_backups
